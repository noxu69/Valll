  <title>For My Dearest Val</title>

  <style>
    :root {
      --primary: #ff4d79;
      --primary-soft: #ffe4ec;
      --gold: #d4a373;
      --card-bg: rgba(255, 255, 255, 0.92);
      --text-main: #2b2326;
      --text-muted: #6e5e64;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(135deg, #fff5f7 0%, #ffeef2 50%, #fff9fb 100%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      overflow-x: hidden;
      min-height: 100vh;
      position: relative;
    }

    /* Background canvas must NOT intercept clicks */
    #petal-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 10;
      max-width: 650px;
      margin: 0 auto;
      padding: 20px 16px 80px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Top Action Bar */
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--primary);
      background: rgba(255, 255, 255, 0.85);
      padding: 8px 16px;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(255, 77, 121, 0.12);
      border: 1px solid rgba(255, 77, 121, 0.2);
    }

    .music-btn {
      background: #ffffff;
      border: 1px solid rgba(255, 77, 121, 0.3);
      color: var(--primary);
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(255, 77, 121, 0.12);
      transition: all 0.2s ease;
    }

    .music-btn:active {
      transform: scale(0.95);
    }

    .music-dot {
      width: 8px;
      height: 8px;
      background: var(--primary);
      border-radius: 50%;
      display: inline-block;
    }

    /* Header */
    .header-badge {
      font-size: 11px;
      letter-spacing: 2px;
      color: #d6336c;
      background: #ffe3ec;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 700;
      margin-bottom: 16px;
      text-align: center;
    }

    .title {
      font-family: 'Playfair Display', serif;
      font-size: 38px;
      font-weight: 800;
      text-align: center;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .title span {
      font-family: 'Dancing Script', cursive;
      color: var(--primary);
      font-size: 46px;
      display: inline-block;
      margin-left: 6px;
    }

    .quote {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      color: var(--text-muted);
      text-align: center;
      font-size: 15px;
      line-height: 1.6;
      max-width: 90%;
      margin: 12px 0 28px 0;
    }

    /* 3D Envelope Component */
    .envelope-box {
      width: 100%;
      max-width: 380px;
      margin: 20px auto 40px auto;
      perspective: 1000px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .envelope-prompt {
      font-family: 'Dancing Script', cursive;
      color: var(--primary);
      font-size: 26px;
      margin-bottom: 4px;
      text-align: center;
    }

    .envelope-sub {
      font-size: 11px;
      letter-spacing: 2px;
      color: #a8949b;
      margin-bottom: 18px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .envelope {
      position: relative;
      width: 320px;
      height: 200px;
      background: #f8c9d6;
      border-radius: 0 0 12px 12px;
      box-shadow: 0 15px 35px rgba(255, 77, 121, 0.2);
    }

    .envelope::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 160px solid #f6b3c4;
      border-right: 160px solid #f6b3c4;
      border-top: 100px solid transparent;
      border-radius: 0 0 12px 12px;
      z-index: 4;
      pointer-events: none;
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 160px solid transparent;
      border-right: 160px solid transparent;
      border-top: 110px solid #f29db4;
      transform-origin: top;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 5;
    }

    .wax-seal {
      position: absolute;
      top: 75px;
      left: 50%;
      transform: translateX(-50%);
      width: 58px;
      height: 58px;
      background: radial-gradient(circle, #ff2a5f 0%, #d8003a 100%);
      border-radius: 50%;
      box-shadow: 0 6px 18px rgba(216, 0, 58, 0.45);
      border: 2px dashed rgba(255, 255, 255, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 6;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      transition: all 0.3s ease;
    }

    .wax-seal:active {
      transform: translateX(-50%) scale(0.92);
    }

      right: 15px;
